<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo de Fechaduras</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-title" content="Fechaduras">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#ece9e4;--card:#fff;--ink:#1c2024;--mut:#6a737b;--line:#ddd9d2;--acc:#a8741a;--accbg:#f5ead3;--head:#1c2024;--bad:#b3362c;--ipbg:#dcebf7;--ipfg:#1d5f94;--sh:0 1px 2px rgba(20,20,20,.06),0 4px 14px rgba(20,20,20,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#121518;--card:#1c2126;--ink:#e9edf0;--mut:#97a3ac;--line:#2d353c;--acc:#d9a441;--accbg:#3a2f18;--head:#0d1013;--bad:#e5766c;--ipbg:#17344d;--ipfg:#8cc4f0;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:9px;min-height:40px;transition:border-color .15s,filter .15s}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover{filter:brightness(1.08)}
button.del{color:var(--bad)}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:16px}
textarea{resize:vertical;line-height:1.45}
.hide{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0 auto 0 2px;font-weight:600}
header button{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}
header button.pri{background:var(--acc);border-color:var(--acc)}
.logo{height:34px;max-width:140px;object-fit:contain}
header .logo{background:#fff;border-radius:8px;padding:3px 7px}
.bar{max-width:1200px;margin:16px auto 0;padding:0 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar input[type=search]{flex:1;min-width:200px;font-size:17px;padding:14px 16px;border-radius:12px;box-shadow:var(--sh)}
.chips{max-width:1200px;margin:12px auto 0;padding:0 18px;display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;padding:5px 14px;border-radius:99px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chip.limpar{border-style:dashed;color:var(--mut)}
.count{max-width:1200px;margin:12px auto;padding:0 18px;color:var(--mut);font-size:14px}
.grid{max-width:1200px;margin:0 auto;padding:0 18px 96px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:box-shadow .2s,transform .2s}
@media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(20,20,20,.13)}}
.imgs{overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px;background:var(--line)}
.imgs figure{min-width:0;overflow:hidden;margin:0;position:relative;aspect-ratio:1;background:var(--bg);display:grid;place-items:center}
.imgs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.imgs figcaption{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:1px 8px;border-radius:99px}
.imgs .vazio{color:var(--mut);font-size:13px}
.tipo{display:flex;align-items:baseline;gap:8px;padding:9px 16px;color:#fff;font-weight:600;font-size:16px;background:#6b7782}
.tipo small{font-weight:400;font-size:13px;opacity:.85}
.tipo-embutir{background:#2b5c8a}
.tipo-sobrepor{background:#1f7a6d}
.body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.body h2{margin:0;font-size:20px;font-weight:600;line-height:1.2}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--accbg);color:var(--acc);padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600}
.tag.ip{background:var(--ipbg);color:var(--ipfg)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px}
dt{color:var(--mut)}dd{margin:0;text-align:right}
.precos{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;margin-top:auto}
.precos div{border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.precos div.venda{background:var(--accbg);border-color:transparent}
.precos small{display:block;color:var(--mut);font-size:12px}
.precos b{font-size:19px;font-variant-numeric:tabular-nums}
.parc{display:block;font-style:normal;color:var(--acc);font-size:12.5px;font-weight:600}
.acoes{display:flex;gap:8px;padding:0 16px 16px}
.acoes button{flex:1}
.vazio-geral{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 0}
.linkbtn{display:block;text-align:center;text-decoration:none;color:var(--acc);border:1px solid var(--acc);border-radius:9px;padding:10px;font-weight:600}
.extra{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.extra summary{cursor:pointer;padding:11px 12px;font-weight:500}
.extrain{display:grid;gap:8px;padding:0 12px 12px}
.texto{white-space:pre-wrap;font-size:14.5px}
.bfoto{aspect-ratio:4/3;background:var(--bg)}
.bfoto img{display:block;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
#baseTabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
dialog{border:0;border-radius:16px;padding:0;max-width:600px;width:calc(100% - 24px);max-height:92vh;overflow:auto;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,14,.6);backdrop-filter:blur(2px)}
form{padding:20px;display:grid;gap:12px}
form h3{margin:0}
form label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.boxmsg{padding:20px;display:grid;gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grp{display:grid;gap:8px}.lbl{font-size:13px;color:var(--mut)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--ink);font-size:14.5px;cursor:pointer}
.checks input{width:auto}
.checks label:has(input:checked){background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.prev{height:110px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;overflow:hidden;font-size:12px}
.prev img{width:100%;height:100%;object-fit:cover}
.fim{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:6px}
.msg{color:var(--bad);font-size:14px;min-height:20px}
.msgbox{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:55vh;overflow:auto}
#login{max-width:360px;margin:12vh auto;padding:0 20px}
#login form{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
#login .logo{display:block;margin:0 auto 4px;height:56px}
#zoom{max-width:92vw;background:transparent}
#zoom img{max-width:100%;max-height:85vh;display:block;margin:auto}
#painel{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:85vw;background:var(--card);border-right:1px solid var(--line);z-index:20;transform:translateX(-100%);transition:transform .2s;padding:calc(20px + env(safe-area-inset-top)) 18px 20px;display:flex;flex-direction:column;gap:10px;overflow:auto}
#painel.aberto{transform:none}
#painel h3{margin:0 0 4px}
#navLinks{display:grid;gap:10px}
#painel a,#painel button{display:block;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--card)}
#painel a:hover,#painel button:hover{border-color:var(--acc)}
#painel button:disabled{opacity:.55;cursor:default}
#ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
#histLista{max-height:60vh;overflow:auto}
.hitem{border-bottom:1px solid var(--line);padding:10px 0;font-size:14px}
.hitem small{display:block;color:var(--mut)}
.det{margin-top:4px;color:var(--mut);font-size:13px}
#fab{display:none;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;border-radius:99px;padding:0 22px;min-height:52px;align-items:center;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media(max-width:640px){
  body{font-size:15.5px}
  header{padding-left:12px;padding-right:12px;flex-wrap:nowrap}
  header h1,#bNovo,#bNovoBase,#bCsv,#bSair{display:none!important}
  header .logo{margin-left:auto}
  #fab{display:flex}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .bar,.chips,.count{padding-left:12px;padding-right:12px}
  .grid{padding:0 12px 100px;gap:14px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;min-height:40px}
  button{min-height:46px}
  .row{grid-template-columns:1fr}
  .row.dois{grid-template-columns:1fr 1fr}
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:94dvh}
  #zoom{margin:auto;border-radius:0;max-height:none}
  form{padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .fim button{flex:1}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="hide">
  <form id="fLogin">
    <img class="logo" src="logo.png" alt="Logo" onerror="this.remove()">
    <h3>Catálogo de Fechaduras</h3>
    <label>E-mail<input type="email" id="lEmail" required autocomplete="username"></label>
    <label>Senha<input type="password" id="lSenha" required autocomplete="current-password"></label>
    <div class="msg" id="lMsg"></div>
    <button class="pri">Entrar</button>
  </form>
</div>

<!-- APP -->
<div id="app" class="hide">
  <div id="ovl" class="hide"></div>
  <aside id="painel">
    <h3>Menu</h3>
    <button type="button" data-vista="catalogo">Catálogo de fechaduras</button>
    <button type="button" data-vista="problema">Base técnica</button>
    <button type="button" data-vista="preco">Precificação de serviço</button>
    <nav id="navLinks"></nav>
    <button type="button" id="bHist">Histórico de alterações</button>
    <button type="button" id="pCsv">Exportar planilha</button>
    <button type="button" id="pBordas">Corrigir bordas das fotos</button>
    <button type="button" id="pPadroniza">Padronizar tags e compatibilidade</button>
    <button type="button" id="pSair">Sair</button>
  </aside>
  <header>
    <button id="bMenu" type="button" aria-label="Abrir menu">☰ Menu</button>
    <img class="logo" src="logo.png" alt="Logo" onerror="this.remove()">
    <h1>Catálogo de Fechaduras</h1>
    <button id="bNovo" class="pri">Novo modelo</button>
    <button id="bNovoBase" class="pri hide">Novo registro</button>
    <button id="bCsv">Exportar planilha</button>
    <button id="bSair">Sair</button>
  </header>
  <section id="vCatalogo">
  <div class="bar">
    <input type="search" id="busca" placeholder="Buscar modelo, embutir, sobrepor…" autofocus>
  </div>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <main class="grid" id="grid"></main>
  </section>

  <section id="vBase" class="hide">
    <div class="bar"><h2 id="baseTitulo" style="margin:0;font-size:20px"></h2></div>
    <div class="bar" id="baseTabs">
      <button type="button" data-cat="problema">Problemas</button>
      <button type="button" data-cat="instalacao">Instalações</button>
    </div>
    <div class="bar"><input type="search" id="buscaBase" placeholder="Buscar por título, descrição ou fechadura…"></div>
    <div class="count" id="countBase"></div>
    <main class="grid" id="gridBase"></main>
  </section>
  <button id="fab" class="pri" type="button">＋ Novo</button>
</div>

<!-- CADASTRO / EDIÇÃO -->
<dialog id="dlg">
  <form id="fModelo">
    <h3 id="dTitulo">Novo modelo</h3>
    <label>Modelo<input id="mModelo" required></label>
    <div class="row">
      <label>Tipo de instalação
        <select id="mTipo"><option>Embutir</option><option>Sobrepor</option></select>
      </label>
      <label>Porta (medida)
        <input id="mPorta" placeholder="ex: 3,5 cm ou 2,5 adaptada">
      </label>
    </div>
    <div class="grp"><span class="lbl">Tags</span><div class="checks" id="mTagsBox"></div><input id="mTagsOutras" placeholder="Outras tags (separe por vírgula)"></div>
    <div class="grp">
      <span class="lbl">Compatibilidade</span>
      <div class="checks" id="mComps"></div>
      <input id="mOutras" placeholder="Outras (separe por vírgula)">
    </div>
    <label>Link da fechadura<input id="mLink" placeholder="https://..."></label>
    <div class="grp"><span class="lbl">Informações adicionais</span></div>
    <label>Link do vídeo comercial<input id="mVidCom" placeholder="https://..."></label>
    <label>Link do vídeo educativo<input id="mVidEdu" placeholder="https://..."></label>
    <label>Mensagem pronta (para copiar e enviar no WhatsApp)
      <textarea id="mMsgPronta" rows="9" placeholder="Digite ou cole aqui o texto completo. As quebras de linha e os emojis serão mantidos."></textarea>
    </label>
    <div class="row dois">
      <label>Preço de instalação (R$)<input id="mInst" type="number" step="0.01" min="0"></label>
      <label>Preço de venda (R$)<input id="mVenda" type="number" step="0.01" min="0"></label>
    </div>
    <label>Valor parcelado (calculado sozinho, pode editar)<input id="mParc" placeholder="ex: 6x de R$ 149,90"></label>
    <div class="lbl" id="parcDica"></div>
    <div class="row">
      <label>Foto da frente<div class="prev" id="pFrente">Sem foto</div><input type="file" accept="image/*" id="mFrente"></label>
      <label>Foto do verso<div class="prev" id="pVerso">Sem foto</div><input type="file" accept="image/*" id="mVerso"></label>
    </div>
    <div class="msg" id="mMsg"></div>
    <div class="fim">
      <button type="button" id="bCancel">Cancelar</button>
      <button class="pri" id="bSalvar">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="dMsg">
  <div class="boxmsg">
    <h3 id="msgTitulo">Mensagem pronta</h3>
    <div class="msgbox" id="msgTexto"></div>
    <div class="checks" id="msgFotos">
      <label id="lFrente"><input type="checkbox" id="cFrente" checked> Foto da frente</label>
      <label id="lVerso"><input type="checkbox" id="cVerso"> Foto do verso</label>
    </div>
    <div class="lbl" id="msgAviso"></div>
    <div class="fim">
      <button type="button" id="bMsgFechar">Fechar</button>
      <button type="button" id="bMsgCopiar">Só copiar texto</button>
      <button type="button" class="pri" id="bMsgZap">Enviar no WhatsApp</button>
    </div>
  </div>
</dialog>

<dialog id="dBase">
  <form id="fBase">
    <h3 id="bsTitulo">Novo registro</h3>
    <label>Fechadura do catálogo (importa o nome e a foto)<select id="bsFech"></select></label>
    <label><span id="bsLblTitulo">Título</span><input id="bsTit" required></label>
    <label><span id="bsLblDesc">Descrição</span><textarea id="bsDesc" rows="7"></textarea></label>
    <label id="bsLblValor">Valor adicional (R$)<input id="bsValor" type="number" step="0.01"></label>
    <label>Foto (opcional)<div class="prev" id="bsPrev">Sem foto</div><input type="file" accept="image/*" id="bsFoto"></label>
    <button type="button" id="bsFotoX">Remover foto</button>
    <div class="msg" id="bsMsg"></div>
    <div class="fim">
      <button type="button" id="bsCancel">Cancelar</button>
      <button class="pri" id="bsSalvar">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="dHist">
  <div class="boxmsg">
    <h3>Histórico de alterações</h3>
    <div id="histLista"></div>
    <div class="fim"><button type="button" id="bHistFechar">Fechar</button></div>
  </div>
</dialog>

<dialog id="zoom"><img alt=""></dialog>
<div id="toast"></div>

<script>
// ====== CONFIGURE AQUI (Supabase > Project Settings > API) ======
const SUPABASE_URL = "https://wywzoihubnuyoxjmgucb.supabase.co";
const SUPABASE_KEY = "sb_publishable_0pK0qLCN6tA1YPHqaqMMRw_u9z7wLa4";
// ================================================================

// ====== LINKS DO PAINEL LATERAL: troque o endereço entre aspas ======
const LINKS = [
  { nome: "MAPA SALVADOR", url: "COLE_AQUI_O_LINK_DO_MAPA" },
  { nome: "QUESTIONÁRIO", url: "COLE_AQUI_O_LINK_DO_QUESTIONARIO" },
  { nome: "CENTRAL DE LEADS", url: "COLE_AQUI_O_LINK_DA_CENTRAL_DE_LEADS" },
  // para adicionar outro link, copie a linha acima e mude o nome e o endereço
];
// ================================================================

// ====== JUROS DO PARCELADO ======
// fator = quanto o parcelado custa sobre o preço à vista (1.10 = 10% a mais no total)
const PARCELAS = [
  { n: 6, fator: 1.10 },
  // { n: 10, fator: 1.1243 },   // para ativar outra opção, tire as duas barras do começo da linha
];
// ================================================

const $ = id => document.getElementById(id);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const COMPAT = ["Madeira","Alumínio","Vidro","Correr Vidro","Correr Madeira","IP55"];
const TAGS = ["Biometria","Senha","Tag","App","App/Wi-fi","App/BT","Chave de emergência","Entrada T/C","Bateria 9V"];
const CHIPS = [{v:"Embutir",l:"Embutir"},{v:"Sobrepor",l:"Sobrepor"}, ...TAGS.map(t=>({v:t,l:t})), {v:"IP55",l:"IP55 · prova d’água"}];
const filtros = new Set();
const atributos = d => new Set([padronizaTipo(d.tipo), ...padroniza(d.tags, TAGS, SINON_TAGS), ...padroniza(d.compatibilidade, COMPAT, {})].map(x => norm(x).trim()).filter(Boolean));

// ---------- Padronização de tags, compatibilidade e tipo ----------
// siglas ficam em MAIÚSCULAS (BT, USB, IP55); nomes comuns ficam normais (Cartão, Senha)
const SINON_TAGS = {
  digital:"Biometria", impressaodigital:"Biometria",
  password:"Senha", codigo:"Senha", senhanumerica:"Senha",
  tags:"Tag", chaveiro:"Tag",
  cartao:"Tag", cartaotag:"Tag", cartaoetag:"Tag", cartaodeproximidade:"Tag",
  aplicativo:"App", controlepeloapp:"App",
  wifi:"App/Wi-fi", wifiapp:"App/Wi-fi", appwifi:"App/Wi-fi",
  bt:"App/BT", bluetooth:"App/BT", btapp:"App/BT", appbluetooth:"App/BT", bluetoothapp:"App/BT",
  chave:"Chave de emergência", chaveemergencia:"Chave de emergência", chavesdeemergencia:"Chave de emergência", emergencia:"Chave de emergência",
  carregamentousb:"Entrada T/C", usb:"Entrada T/C", cargausb:"Entrada T/C", carregamento:"Entrada T/C", carregadorusb:"Entrada T/C", entradausb:"Entrada T/C", typec:"Entrada T/C", tipoc:"Entrada T/C", entradatipoc:"Entrada T/C", entradatypec:"Entrada T/C",
  "9v":"Bateria 9V", bateria:"Bateria 9V"
};
const chave = t => norm(t).replace(/[^a-z0-9]/g, "");
const suave = t => /^ip\d+$/i.test(t) ? t.toUpperCase()
  : (t === t.toUpperCase() && t.length <= 4 && /[A-Z]/.test(t)) ? t
  : t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
function padroniza(txt, lista, sin){
  const mapa = {...sin}; lista.forEach(t => mapa[chave(t)] = t);
  const out = [];
  String(txt || "").split(",").map(t => t.trim()).filter(Boolean).forEach(bruto => {
    [].concat(mapa[chave(bruto)] || suave(bruto)).forEach(i => { if(!out.includes(i)) out.push(i); });
  });
  const ordem = t => { const i = lista.indexOf(t); return i < 0 ? 999 : i; };
  return out.sort((a, b) => ordem(a) - ordem(b));
}

let msgFiles = {}, msgId = 0;
async function carregarFoto(url, nome){
  try{ const b = await (await fetch(url)).blob(); return new File([b], nome, {type: b.type || "image/jpeg"}); }
  catch(_){ return null; }
}
async function abrirMsg(d){
  const id = ++msgId; msgFiles = {};
  $("msgTitulo").textContent = d.modelo; $("msgTexto").textContent = d.mensagem;
  $("lFrente").classList.toggle("hide", !d.foto_frente); $("lVerso").classList.toggle("hide", !d.foto_verso);
  $("cFrente").checked = !!d.foto_frente; $("cVerso").checked = false;
  const temFoto = d.foto_frente || d.foto_verso;
  $("bMsgZap").disabled = !!temFoto; $("msgAviso").textContent = temFoto ? "Preparando as fotos…" : "";
  $("dMsg").showModal();
  if(!temFoto) return;
  const slug = norm(d.modelo).replace(/[^a-z0-9]+/g,"-");
  const [f, v] = await Promise.all([
    d.foto_frente ? carregarFoto(d.foto_frente, slug+"-frente.jpg") : null,
    d.foto_verso ? carregarFoto(d.foto_verso, slug+"-verso.jpg") : null
  ]);
  if(id !== msgId) return;
  msgFiles = {frente:f, verso:v};
  $("msgAviso").textContent = ""; $("bMsgZap").disabled = false;
}
$("bMsgZap").onclick = async () => {
  const t = $("msgTexto").textContent, files = [];
  if($("cFrente").checked && msgFiles.frente) files.push(msgFiles.frente);
  if($("cVerso").checked && msgFiles.verso) files.push(msgFiles.verso);
  try{ navigator.clipboard.writeText(t).catch(()=>{}); }catch(_){}   // garantia: texto também fica copiado
  if(files.length && navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files, text:t}); $("dMsg").close(); return; }
    catch(err){ if(err.name === "AbortError") return; }
  }
  window.open("https://wa.me/?text=" + encodeURIComponent(t), "_blank");
  toast(files.length ? "Este aparelho não envia foto automática. Anexe a foto no WhatsApp." : "WhatsApp aberto com o texto");
};

// reduz a foto (máx. 1400 px no lado maior), mantendo a imagem inteira, sem bordas
function reduzir(file){
  return new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1400 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(b => b ? ok(b) : fail(new Error("Falha ao processar a imagem")), "image/jpeg", 0.85);
    };
    img.onerror = () => fail(new Error("Imagem inválida"));
    img.src = URL.createObjectURL(file);
  });
}
function pegarTags(){
  const m = [...document.querySelectorAll("#mTagsBox input:checked")].map(i=>i.value);
  return padroniza([...m, $("mTagsOutras").value].join(","), TAGS, SINON_TAGS).join(", ");
}
function pegarComp(){
  const marcadas = [...document.querySelectorAll("#mComps input:checked")].map(i=>i.value);
  const outras = $("mOutras").value.split(",").map(t=>t.trim()).filter(Boolean);
  return padroniza([...marcadas, ...outras].join(","), COMPAT, {}).join(", ");
}
function normLink(v){
  v = v.trim(); if(!v) return null;
  return /^https?:\/\//i.test(v) ? v : "https://" + v;
}
async function subir(file){
  const blob = await reduzir(file);
  const nome = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
  const {error} = await sb.storage.from("fotos").upload(nome, blob, {contentType:"image/jpeg"});
  if(error) throw error;
  return sb.storage.from("fotos").getPublicUrl(nome).data.publicUrl;
}

  $("bsValor").value = d?.valor ?? ""; $("bsFoto").value = ""; baseFotoUrl = d?.foto || null; previa($("bsPrev"), baseFotoUrl);
  $("dBase").showModal();
}
$("painel").onclick = e => { if(e.target.dataset.vista) irPara(e.target.dataset.vista); };
$("baseTabs").onclick = e => { if(e.target.dataset.cat) irPara(e.target.dataset.cat); };
$("buscaBase").oninput = renderBase;
$("bNovoBase").onclick = () => abrirBase(null);
$("bsCancel").onclick = () => $("dBase").close();
$("bsFoto").onchange = e => { baseFile = e.target.files[0]; if(baseFile) previa($("bsPrev"), URL.createObjectURL(baseFile)); };
$("gridBase").onclick = async e => {
  const t = e.target.dataset;
  if(t.zoom){ $("zoom").querySelector("img").src = t.zoom; $("zoom").showModal(); return; }
  if(t.bedit) abrirBase(baseDados.find(x => x.id === t.bedit));
  if(t.bdel){
    const d = baseDados.find(x => x.id === t.bdel);
    if(!confirm(`Excluir "${d.titulo}"?`)) return;
    const {error} = await sb.from("base_tecnica").delete().eq("id", d.id);
    if(error) return toast("Erro: " + error.message);
    toast("Registro excluído"); carregarBase();
  }
};
$("fBase").onsubmit = async e => {
  e.preventDefault();
  const btn = $("bsSalvar"); btn.disabled = true; btn.textContent = "Salvando…"; $("bsMsg").textContent = "";
  try{
    const cat = baseEdit?.categoria || vista;
    const reg = {
      categoria: cat, titulo: $("bsTit").value.trim(), descricao: $("bsDesc").value.trim() || null,
      fechadura: $("bsFech").value || null,
      valor: (cat === "preco" && $("bsValor").value !== "") ? Number($("bsValor").value) : null,
      foto: baseFotoUrl
    };
    if(baseFile) reg.foto = await subir(baseFile);
    const r = baseEdit ? await sb.from("base_tecnica").update(reg).eq("id", baseEdit.id)
                       : await sb.from("base_tecnica").insert(reg);
    if(r.error) throw r.error;
    $("dBase").close(); toast("Registro salvo"); carregarBase();
  }catch(err){ $("bsMsg").textContent = "Erro ao salvar: " + (err.message || err); }
  btn.disabled = false; btn.textContent = "Salvar";
};

// ---------- Filtros por tag ----------
$("chips").innerHTML = CHIPS.map(c => `<button type="button" class="chip" data-f="${esc(c.v)}">${esc(c.l)}</button>`).join("")
  + `<button type="button" class="chip limpar hide" id="chipLimpar" data-f="">Limpar filtros</button>`;
$("chips").onclick = e => {
  const b = e.target.closest("[data-f]"); if(!b) return;
  const f = b.dataset.f;
  if(f === ""){ filtros.clear(); $("chips").querySelectorAll(".on").forEach(x => x.classList.remove("on")); }
  else { filtros.has(f) ? filtros.delete(f) : filtros.add(f); b.classList.toggle("on"); }
  $("chipLimpar").classList.toggle("hide", !filtros.size);
  render();
};

// ---------- Importar fechadura do catálogo (Base técnica) ----------
$("bsFech").onchange = () => {
  const m = dados.find(x => x.modelo === $("bsFech").value);
  if(!m) return;
  if((baseEdit?.categoria || vista) === "instalacao" && !$("bsTit").value.trim()) $("bsTit").value = m.modelo;
  const fotoDoCatalogo = !baseFotoUrl || dados.some(x => x.foto_frente === baseFotoUrl);
  if(!baseFile && fotoDoCatalogo && m.foto_frente){ baseFotoUrl = m.foto_frente; previa($("bsPrev"), baseFotoUrl); }
};
$("bsFotoX").onclick = () => { baseFile = null; baseFotoUrl = null; $("bsFoto").value = ""; previa($("bsPrev"), null); };

// ---------- Parcelado automático ----------
let parcManual = false;
// arredonda para cima até o próximo valor terminado em 9,90 (52,45 -> 59,90 | 59,24 -> 59,90 | 146,65 -> 149,90)
function arredonda90(v){ const c = Math.round(v*100); return (Math.ceil((c+10)/1000)*1000 - 10) / 100; }
function calcParcelas(venda){ return PARCELAS.map(p => ({n:p.n, v:arredonda90(venda*p.fator/p.n)})); }
$("mParc").oninput = () => { parcManual = true; };
$("mVenda").oninput = () => {
  if(parcManual) return;
  const venda = Number($("mVenda").value);
  if(!(venda > 0)){ $("mParc").value = ""; $("parcDica").textContent = ""; return; }
  const ps = calcParcelas(venda);
  $("mParc").value = ps.map(p => `${p.n}x de ${brl(p.v)}`).join(" ou ");
  $("parcDica").textContent = ps.map(p => `${p.n}x = total de ${brl(p.n*p.v)}`).join(" · ");
};

// ---------- Corrigir bordas brancas das fotos já enviadas ----------
function aparaBordas(blob){
  return new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const x = c.getContext("2d", {willReadFrequently:true}); x.drawImage(img,0,0);
      const px = x.getImageData(0,0,w,h).data;
      const branco = i => px[i] > 244 && px[i+1] > 244 && px[i+2] > 244;
      const linha = y => { for(let a=0;a<w;a++) if(!branco((y*w+a)*4)) return true; return false; };
      const coluna = a => { for(let y=0;y<h;y++) if(!branco((y*w+a)*4)) return true; return false; };
      let t = 0, b = h-1, l = 0, r = w-1;
      while(t < b && !linha(t)) t++;
      while(b > t && !linha(b)) b--;
      while(l < r && !coluna(l)) l++;
      while(r > l && !coluna(r)) r--;
      const nw = r-l+1, nh = b-t+1;
      if(nw > w*0.97 && nh > h*0.97) return ok(null);
      const c2 = document.createElement("canvas"); c2.width = nw; c2.height = nh;
      c2.getContext("2d").drawImage(c, l, t, nw, nh, 0, 0, nw, nh);
      c2.toBlob(bb => bb ? ok(bb) : fail(new Error("Falha ao cortar")), "image/jpeg", 0.88);
    };
    img.onerror = () => fail(new Error("Imagem inválida"));
    img.src = URL.createObjectURL(blob);
  });
}
async function corrigirBordas(){
  if(!confirm("Vou procurar bordas brancas nas fotos do catálogo e da base técnica e cortar. As fotos corrigidas substituem as atuais nos cards. Continuar?")) return;
  const urls = new Set();
  dados.forEach(d => { if(d.foto_frente) urls.add(d.foto_frente); if(d.foto_verso) urls.add(d.foto_verso); });
  baseDados.forEach(d => { if(d.foto) urls.add(d.foto); });
  let i = 0, feitas = 0, erros = 0;
  for(const url of urls){
    i++; toast(`Corrigindo fotos… ${i}/${urls.size}`);
    try{
      const novo = await aparaBordas(await (await fetch(url)).blob());
      if(!novo) continue;
      const nome = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const up = await sb.storage.from("fotos").upload(nome, novo, {contentType:"image/jpeg"});
      if(up.error) throw up.error;
      const nova = sb.storage.from("fotos").getPublicUrl(nome).data.publicUrl;
      await sb.from("fechaduras").update({foto_frente:nova}).eq("foto_frente", url);
      await sb.from("fechaduras").update({foto_verso:nova}).eq("foto_verso", url);
      await sb.from("base_tecnica").update({foto:nova}).eq("foto", url);
      feitas++;
    }catch(_){ erros++; }
  }
  await carregar(); await carregarBase();
  toast(`${feitas} foto(s) corrigida(s)` + (erros ? `, ${erros} com erro` : ""));
}
$("pBordas").onclick = () => { painel(false); corrigirBordas(); };

// ---------- Gravar a padronização nos cadastros existentes ----------
async function padronizarBanco(){
  const mudar = [], fora = new Set();
  dados.forEach(d => {
    const novo = {};
    const tipo = padronizaTipo(d.tipo);
    const tags = padroniza(d.tags, TAGS, SINON_TAGS);
    const comp = padroniza(d.compatibilidade, COMPAT, {});
    if(d.tipo && tipo !== d.tipo) novo.tipo = tipo;
    if(d.tags && tags.join(", ") !== d.tags) novo.tags = tags.join(", ");
    if(d.compatibilidade && comp.join(", ") !== d.compatibilidade) novo.compatibilidade = comp.join(", ");
    tags.filter(t => !TAGS.includes(t)).forEach(t => fora.add(t));
    if(Object.keys(novo).length) mudar.push({id:d.id, novo});
  });
  if(!mudar.length) return toast("Tudo já está padronizado");
  const aviso = fora.size ? `\n\nTags fora da lista (ficam como "Outras tags"): ${[...fora].join(", ")}` : "";
  if(!confirm(`${mudar.length} modelo(s) serão ajustados (tags, compatibilidade e tipo).${aviso}\n\nContinuar?`)) return;
  let erros = 0;
  for(const m of mudar){
    const {error} = await sb.from("fechaduras").update(m.novo).eq("id", m.id);
    if(error) erros++;
  }
  await carregar();
  toast(`${mudar.length - erros} modelo(s) padronizados` + (erros ? `, ${erros} com erro` : ""));
}
$("pPadroniza").onclick = () => { painel(false); padronizarBanco(); };

// ---------- Celular ----------
$("fab").onclick = () => vista === "catalogo" ? abrir(null) : abrirBase(null);
$("pCsv").onclick = () => $("bCsv").click();
$("pSair").onclick = () => $("bSair").click();

iniciar();
